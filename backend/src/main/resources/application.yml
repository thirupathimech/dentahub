spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: dentahub
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dentahub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.dentahub: INFO
