services:
  mysql:
    image: mysql:8.4
    container_name: dentahub-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-dentahub}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - dentahub_mysql_data:/var/lib/mysql

volumes:
  dentahub_mysql_data:
